<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="GitHub stats">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0f16"/><stop offset="1" stop-color="#131935"/></linearGradient></defs>
<style>
  .k { font: 600 12px 'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace; fill: #8b8d97; letter-spacing: 2px }
  .v { font: 800 34px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #eeeee9; letter-spacing: -1px }
  .h { font: 700 13px 'JetBrains Mono', SFMono-Regular, Consolas, 'Liberation Mono', monospace; fill: #93a5ff; letter-spacing: 3px }
